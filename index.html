<!DOCTYPE html>
<!--
  Arquivos do drift para a web (research.md R2), sempre da mesma release:
  - sqlite3.wasm e drift_worker.js: drift 2.35.3
    (https://github.com/simolus3/drift/releases/tag/drift-2.35.3)
  Ao atualizar o drift no pubspec.yaml, baixar os dois arquivos da release correspondente.
-->
<html lang="pt-BR">
<head>
  <base href="/supermarket-list-sdd/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Listas de supermercado pessoais, offline.">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Listas">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Listas de Supermercado</title>
  <link rel="manifest" href="manifest.json">

  <!-- Splash enquanto o Flutter carrega; #4C4E53 = BrandColors.grayDark. -->
  <style>
    html, body { margin: 0; background: #4C4E53; }
    #splash {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: #4C4E53;
    }
    #splash img { width: 240px; max-width: 70vw; }
  </style>
</head>
<body>
  <div id="splash" aria-hidden="true">
    <img src="assets/assets/images/logo_light.png" alt="">
  </div>
  <script>
    // Some no primeiro frame do Flutter, que mostra a splash animada.
    window.addEventListener('flutter-first-frame', () => {
      document.getElementById('splash')?.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Offline: registra o sw.js só quando o build tem sw_manifest.js
    // (gerado após `flutter build web`); em `flutter run` (debug) ele não existe.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        try {
          const manifest = await fetch('sw_manifest.js', { method: 'HEAD', cache: 'no-store' });
          if (manifest.ok) {
            await navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' });
          }
        } catch (_) {
          // Sem rede ou sem suporte: o worker já registrado continua valendo.
        }
      });
    }
  </script>
</body>
</html>
