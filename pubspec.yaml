name: supermarket_list
description: "Listas de supermercado pessoais, offline, com a identidade visual T_YOU."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

# Versões exatas, sem `^` (Constituição IV; research.md R18). O pubspec.lock é versionado.
dependencies:
  flutter:
    sdk: flutter
  drift: 2.35.3
  drift_flutter: 0.3.1
  file_picker: 13.2.0
  flutter_riverpod: 3.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: 2.17.1
  drift_dev: 2.35.2
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Michroma
      fonts:
        - asset: assets/fonts/Michroma-Regular.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
